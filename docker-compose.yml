services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://host.docker.internal:6006/v1/traces}
      PHOENIX_HEALTH_URL: ${PHOENIX_HEALTH_URL:-http://host.docker.internal:6006}
      PHOENIX_UI_URL: http://localhost:6006
      PHOENIX_PROJECT_NAME: ros-agent
      ROS_MCP_URL: ${ROS_MCP_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/workspace/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/observability', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
