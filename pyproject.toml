[project]
name = "ros-agent"
version = "0.1.0"
description = "Goal-driven ROS2 agent with MCP, RAG, and Phoenix observability"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "ollama",
    "mcp[cli]>=2,<3",
    "chromadb",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
    "pydantic>=2,<3",
    "jsonschema>=4,<5",
    "fastapi",
    "uvicorn",
    "arize-phoenix-otel",
    "opentelemetry-api",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["web_app"]

[tool.setuptools.packages.find]
include = ["pipelines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
